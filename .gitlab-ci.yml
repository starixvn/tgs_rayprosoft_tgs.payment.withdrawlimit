include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/payment-withdraw-limit
  TgsSettingKey: payment-withdraw-limit
  BuildCacheKey: Tgs.Payment-WithdrawLimit.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  variables:
    DOTNET_USE_POLLING_FILE_WATCHER: "true"

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.Payment.WithdrawLimit.Client"
  artifacts:
    paths:
      - Tgs.Payment.WithdrawLimit.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.Payment.WithdrawLimit/Tgs.Payment.WithdrawLimit.csproj" $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template "withdraw-limit" $ImageName $Tag

deploy-dev:
  extends: .deploy-k8s-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  tags:
    - dev
    - kubernetes
    - deploy
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey "withdraw-limit" $namespace
  when: on_success

deploy-staging:
  extends: .deploy-k8s-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  tags:
    - staging
    - kubernetes
    - deploy
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey "withdraw-limit" $namespace

deploy-prod:
  extends: .deploy-k8s-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  tags:
    - prod
    - kubernetes
    - deploy
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey "withdraw-limit" $namespace
