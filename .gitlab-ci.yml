include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/payment-withdraw-limit
  TgsSettingKey: payment-withdraw-limit
  BuildCacheKey: Tgs.Payment-WithdrawLimit.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  variables:
    DOTNET_USE_POLLING_FILE_WATCHER: "true"  

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.Payment.Client"
    - push_package "PaymentService.Client"
  artifacts:
    paths:
      - Tgs.Payment.Client/bin/$BuildConfiguration/*.nupkg
      - PaymentService.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "PaymentService/PaymentService.csproj" $ImageName $Tag

push-bankinfo-rebuild-hash-job-image:
  extends: .push-docker-image-template
  when: manual
  script:
    - push_docker "PlayerBankInfoRebuildHash/PlayerBankInfoRebuildHash.csproj" $RebuildHashImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template "payment-api" $ImageName $Tag

push-bankinfo-rebuild-hash-k8s-template:
  extends: .push-k8s-template
  needs:
    - push-bankinfo-rebuild-hash-job-image
  script:
    - push_k8s_template "bankinfo-rebuild-hash" $ImageName $Tag

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey "payment-api" $namespace
  when: on_success

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey "payment-api" $namespace

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey "payment-api" $namespace
